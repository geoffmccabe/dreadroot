# Cloudflare Worker + Durable Object config for the DreadRoot L2 game server.
# Deploy from this directory:  wrangler deploy   (local test: wrangler dev)
name = "dreadroot-l2"
main = "index.ts"
compatibility_date = "2026-06-08"

# Serve the live realtime server at server.dreadroot.com. With the dreadroot.com
# zone on this Cloudflare account, deploy auto-creates the DNS record + TLS cert.
[[routes]]
pattern = "server.dreadroot.com"
custom_domain = true

# One Durable Object class = one live game instance (addressed by ?instance=<id>).
[[durable_objects.bindings]]
name = "GAME_INSTANCE"
class_name = "GameInstanceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameInstanceDO"]

# Monster population on the server. 1 = the game's own spawn tuning, which is
# deliberately very sparse (~1% per minute, i.e. one creature every several
# minutes across the whole visible area) and effectively invisible in a short
# session. Raised here so server-owned monsters can actually be SEEN and
# judged. This is a FEEL value to tune, not a correctness one.
[vars]
ENEMY_DENSITY = "120"
